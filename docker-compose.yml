# Local development only. Heroku deploys with the classic Ruby buildpack, not Docker.
services:
  mongo:
    image: mongo:8.0.34
    volumes:
      - ./mongo-data:/data/db # bind mount, gitignored: the database files live in this folder
    ports:
      - "127.0.0.1:27017:27017"

  # Data viewer for the local database: http://localhost:3100
  mongoku:
    image: huggingface/mongoku:latest
    environment:
      MONGOKU_DEFAULT_HOST: mongodb://mongo:27017
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "rm -f tmp/pids/server.pid && bin/rails s -b 0.0.0.0"
    environment:
      MONGO_URI: mongodb://mongo:27017/ishop
      MONGO_TEST_URI: mongodb://mongo:27017/ishop_test
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development-only-secret-key-base-not-for-production}
      to_email: ${to_email:-}
      gmail_username: ${gmail_username:-}
      gmail_password: ${gmail_password:-}
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  # The upgraded app in production mode, with only the env vars Heroku provides (see DEPLOYMENT_RUNBOOK.md).
  # Used for the snapshot comparison against `baseline`: `docker compose --profile production-check up -d web_prod`.
  web_prod:
    profiles: ["production-check"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "rm -f tmp/pids/server.pid && bin/rails s -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: production
      DB_URI: mongodb://mongo:27017/ishop
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development-only-secret-key-base-not-for-production}
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    ports:
      - "3002:3000"
    depends_on:
      - mongo

  # Reference build of the original app (Ruby 2.7.8 / Rails 6.0.6.1) for API snapshots.
  # Source: a `git archive master` copy in ../zlata-baseline (see docker/prepare-baseline.sh).
  baseline:
    profiles: ["baseline"]
    build:
      context: docker
      dockerfile: baseline.Dockerfile
    command: sh -c "rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_SERVE_STATIC_FILES: "1"
      DB_URI: mongodb://mongo:27017/ishop
      MONGO_HOST: mongo
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development-only-secret-key-base-not-for-production}
    volumes:
      - ${BASELINE_DIR:-../zlata-baseline}:/app
      - ./spec:/app/spec:ro
      - ./.rspec:/app/.rspec:ro
      - baseline-bundle:/usr/local/bundle
    ports:
      - "3001:3000"
    depends_on:
      - mongo

volumes:
  bundle:
  baseline-bundle:
    name: zlata-baseline-bundle
