<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zlata - visual redesign concepts</title>
  <style>
    @font-face { font-family: Crimson; src: url("assets/crimson.woff2"); }
    @font-face { font-family: Crimson; font-style: italic; src: url("assets/crimson-italic.woff2"); }
    @font-face { font-family: Lato; src: url("assets/lato.woff2"); }
    :root { --paper: #faf8f4; --ink: #292723; --muted: #716b63; --line: #e3ddd4; --sand: #b0a08b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Lato, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: Crimson, Georgia, serif; font-weight: 400; }
    .announcement { height: 30px; display: flex; align-items: center; justify-content: center; background: #eee9e1; color: #655e55; font-size: 10px; letter-spacing: 1.7px; }
    .header { height: 90px; padding: 0 64px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: var(--paper); }
    .brand img { width: 126px; height: 58px; object-fit: contain; display: block; mix-blend-mode: multiply; }
    .nav { display: flex; gap: 29px; align-items: center; font-size: 12px; }
    .nav .active { border-bottom: 1px solid var(--ink); padding: 10px 0; }
    .utilities { display: flex; align-items: center; gap: 22px; }
    .icon-button { border: 0; background: transparent; padding: 8px; display: flex; align-items: center; justify-content: center; }
    .language { font-size: 11px; display: flex; align-items: center; gap: 6px; }
    .language svg { width: 12px; }
    .eyebrow { font-size: 10px; letter-spacing: 2.3px; text-transform: uppercase; color: var(--muted); }
    .btn { min-height: 50px; padding: 0 24px; display: inline-flex; align-items: center; justify-content: center; gap: 24px; font-size: 12px; border: 1px solid var(--ink); }
    .btn.dark { background: var(--ink); color: #fff; }
    .text-link { display: inline-flex; align-items: center; gap: 12px; font-size: 12px; border-bottom: 1px solid #a69c8f; padding-bottom: 7px; }
    .text-link svg { width: 16px; height: 16px; }
    .hero { display: grid; grid-template-columns: 43% 57%; height: 588px; }
    .hero-copy { padding: 81px 60px 45px 88px; display: flex; flex-direction: column; align-items: flex-start; background: #f0ebe3; }
    .hero h1 { font-size: 76px; line-height: .99; letter-spacing: -2.4px; margin: 24px 0; }
    .hero h1 em { font-weight: 400; color: #887762; }
    .hero-copy p { font-size: 14px; line-height: 1.85; color: #686158; max-width: 325px; margin-bottom: 28px; }
    .hero-copy .text-link { margin-top: 22px; }
    .hero-photo { position: relative; overflow: hidden; }
    .hero-photo > img { width: 100%; height: 100%; object-fit: cover; object-position: 62% center; }
    .collection-tag { position: absolute; right: 32px; bottom: 28px; padding: 18px 22px; background: rgba(250,248,244,.93); width: 193px; }
    .collection-tag h3 { font-size: 30px; margin: 5px 0 9px; }
    .collection-tag a { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
    .category-strip { height: 73px; padding: 0 88px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .category-strip a { width: 31%; display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .category-strip a + a { border-left: 1px solid var(--line); padding-left: 45px; }
    .featured { padding: 51px 88px 42px; }
    .section-title { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
    .section-title h2 { font-size: 43px; line-height: 1.08; margin-top: 9px; }
    .cards { display: grid; gap: 24px; }
    .cards.four { grid-template-columns: repeat(4, 1fr); }
    .card { min-width: 0; }
    .card-photo { position: relative; background: #e9e4dd; aspect-ratio: 2 / 3; overflow: hidden; }
    .card-photo > img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-photo .save { position: absolute; right: 13px; top: 13px; width: 35px; height: 35px; background: rgba(250,248,244,.95); border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; }
    .card-photo .save svg { width: 17px; height: 17px; }
    .card-info { padding: 14px 1px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .card-info h3 { font-size: 26px; line-height: 1; }
    .card-info > span { font-size: 10px; color: var(--muted); }
    .card .collection { font-size: 10px; color: var(--muted); margin-top: 8px; }
    .footer { margin: 0 64px; border-top: 1px solid var(--line); min-height: 75px; display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--muted); }
    .footer-links { display: flex; gap: 25px; }
    .concept-note { font-size: 9px; color: #888075; text-align: center; padding: 0 20px 18px; letter-spacing: .25px; }
    .breadcrumb { padding: 27px 72px 0; font-size: 10px; color: #827b71; display: flex; gap: 12px; align-items: center; }
    .breadcrumb svg { height: 10px; width: 10px; }
    .catalog-intro { padding: 33px 72px 38px; }
    .catalog-intro h1 { font-size: 63px; margin: 8px 0 12px; line-height: 1; }
    .catalog-intro p { color: var(--muted); font-size: 13px; }
    .catalog { display: grid; grid-template-columns: 228px 1fr; gap: 48px; padding: 0 72px 44px; }
    .filters { border-top: 1px solid var(--line); padding-top: 22px; }
    .filter-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font-size: 13px; }
    .filter-heading a { color: var(--muted); font-size: 10px; text-decoration: underline; text-underline-offset: 3px; }
    .filter-section { padding: 0 0 25px; margin-bottom: 25px; border-bottom: 1px solid var(--line); }
    .filter-section h3 { font-family: Lato, sans-serif; font-size: 12px; margin-bottom: 18px; display: flex; justify-content: space-between; }
    .filter-section h3 svg { width: 12px; height: 12px; }
    .option { display: flex; align-items: center; gap: 9px; font-size: 11px; color: #6a635b; margin-top: 13px; }
    .checkbox { width: 13px; height: 13px; border: 1px solid #b8afa1; display: inline-flex; align-items: center; justify-content: center; }
    .checkbox.checked { background: var(--ink); border-color: var(--ink); }
    .checkbox.checked svg { width: 10px; height: 10px; color: white; }
    .sizes { display: flex; gap: 8px; }
    .size { border: 1px solid #d2cabe; background: transparent; color: #625b52; width: 43px; height: 40px; font-size: 11px; }
    .size.selected { color: var(--ink); border: 1px solid var(--ink); background: #eae4da; }
    .swatch { display: inline-block; border-radius: 50%; border: 1px solid #c9c0b3; width: 17px; height: 17px; }
    .ivory { background: #f3eee1; }
    .cappuccino { background: #c1ac90; }
    .help-card { background: #eee8de; padding: 24px 20px; margin-top: 31px; }
    .help-card h3 { font-size: 25px; line-height: 1.1; }
    .help-card p { font-size: 11px; line-height: 1.8; color: var(--muted); margin: 12px 0 16px; }
    .help-card a { font-size: 11px; display: flex; align-items: center; gap: 13px; }
    .catalog-toolbar { border-top: 1px solid var(--line); height: 65px; display: flex; justify-content: space-between; align-items: center; }
    .catalog-toolbar .count { font-size: 11px; color: var(--muted); }
    .toolbar-right { display: flex; align-items: center; gap: 25px; }
    .toolbar-search { width: 210px; display: flex; align-items: center; gap: 9px; padding-bottom: 8px; border-bottom: 1px solid #d5cdc0; font-size: 10px; color: var(--muted); }
    .toolbar-search svg { width: 15px; height: 15px; }
    .sort { display: flex; gap: 8px; align-items: center; font-size: 10px; }
    .sort svg { width: 12px; }
    .cards.three { grid-template-columns: repeat(3, 1fr); gap: 31px 22px; }
    .catalog .card-info h3 { font-size: 24px; }
    .product { padding: 32px 80px 42px; display: grid; grid-template-columns: 58% 42%; gap: 0; }
    .product-gallery { padding-right: 54px; }
    .product-main { height: 726px; background: #e7e1d9; position: relative; }
    .product-main > img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .zoom { position: absolute; right: 16px; bottom: 16px; width: 43px; height: 43px; background: var(--paper); border: 0; display: flex; align-items: center; justify-content: center; }
    .thumbnails { display: flex; gap: 12px; margin-top: 16px; }
    .thumb { width: 65px; height: 83px; padding: 3px; border: 1px solid transparent; }
    .thumb.selected { border-color: #756655; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-hint { font-size: 10px; color: var(--muted); align-self: center; margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .gallery-hint svg { width: 15px; height: 15px; }
    .product-info { padding: 26px 0 0 22px; }
    .product-info h1 { font-size: 69px; line-height: 1; margin: 14px 0; }
    .product-price { font-size: 13px; color: #5c544a; margin-bottom: 24px; }
    .product-description { font-size: 13px; line-height: 1.9; color: var(--muted); max-width: 370px; padding-bottom: 25px; border-bottom: 1px solid var(--line); }
    .field-label { font-size: 11px; display: flex; justify-content: space-between; align-items: center; margin: 25px 0 14px; }
    .field-label a { font-size: 10px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    .color-options { display: flex; gap: 20px; }
    .color-options .option { margin: 0; font-size: 11px; }
    .color-options .swatch { width: 26px; height: 26px; }
    .color-options .chosen { outline: 1px solid #82735f; outline-offset: 3px; }
    .product-info .size { width: 54px; height: 44px; }
    .size-hint { font-size: 10px; color: var(--muted); margin: 11px 0 23px; }
    .enquire { width: 100%; min-height: 54px; justify-content: space-between; }
    .secondary-actions { display: flex; justify-content: space-between; align-items: center; padding: 18px 0 24px; border-bottom: 1px solid var(--line); font-size: 11px; }
    .secondary-actions a { display: flex; align-items: center; gap: 10px; }
    .secondary-actions svg { width: 16px; height: 16px; }
    .accordion { display: flex; justify-content: space-between; align-items: center; padding: 21px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
    .accordion svg { width: 13px; height: 13px; }
    .question { font-size: 10px; color: var(--muted); line-height: 1.8; margin-top: 20px; }
    .question a { text-decoration: underline; text-underline-offset: 3px; }
    .mobile-page { background: var(--paper); width: 390px; min-height: 950px; padding-bottom: 88px; }
    .mobile-header { height: 66px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
    .mobile-header .brand img { width: 100px; height: 48px; }
    .mobile-breadcrumb { height: 38px; display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--muted); padding: 0 20px; }
    .mobile-breadcrumb svg { width: 10px; height: 10px; }
    .mobile-image { margin: 0 16px; height: 418px; position: relative; background: #e9e3dc; }
    .mobile-image img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .photo-count { position: absolute; bottom: 12px; right: 12px; background: rgba(250,248,244,.95); padding: 7px 10px; font-size: 9px; display: flex; align-items: center; gap: 6px; }
    .photo-count svg { width: 13px; height: 13px; }
    .dots { height: 27px; display: flex; justify-content: center; align-items: center; gap: 7px; }
    .dot { width: 4px; height: 4px; border-radius: 50%; background: #c9c0b4; }
    .dot.active { width: 5px; height: 5px; background: #4d463e; }
    .mobile-info { padding: 12px 22px 0; }
    .mobile-info .eyebrow { font-size: 8px; letter-spacing: 1.7px; }
    .mobile-title { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 7px; }
    .mobile-title h1 { font-size: 45px; line-height: 1; }
    .mobile-title span { font-size: 10px; color: var(--muted); }
    .mobile-info > p { font-size: 11px; line-height: 1.7; color: var(--muted); }
    .mobile-info .field-label { margin-top: 19px; margin-bottom: 12px; font-size: 10px; }
    .mobile-info .color-options .swatch { width: 20px; height: 20px; }
    .mobile-info .color-options .option { font-size: 10px; }
    .mobile-info .sizes { gap: 8px; }
    .mobile-info .size { width: 51px; height: 39px; }
    .mobile-info .question { font-size: 9px; margin-top: 14px; }
    .mobile-action { position: fixed; bottom: 0; left: 0; width: 390px; background: var(--paper); border-top: 1px solid var(--line); padding: 12px 18px 17px; display: flex; gap: 10px; align-items: center; }
    .mobile-action .btn { flex: 1; padding: 0 17px; font-size: 11px; justify-content: space-between; min-height: 48px; }
    .mobile-action .icon-button { height: 48px; width: 48px; border: 1px solid #d2cabe; }
    body.mobile { width: 390px; }
  </style>
</head>
<body>
  <main id="concept"></main>
  <script>
    const icons = {
      arrow: '<svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>',
      diagonal: '<svg viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12"/></svg>',
      chevron: '<svg viewBox="0 0 24 24"><path d="m8 5 7 7-7 7"/></svg>',
      down: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
      heart: '<svg viewBox="0 0 24 24"><path d="M20.7 4.7a5.5 5.5 0 0 0-7.8 0L12 5.8l-1-1.1a5.5 5.5 0 0 0-7.7 7.8L12 21l8.7-8.5a5.5 5.5 0 0 0 0-7.8Z"/></svg>',
      search: '<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>',
      plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      minus: '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
      menu: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
      check: '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
      link: '<svg viewBox="0 0 24 24"><path d="m10 13 4-4m-7 2-2 2a4 4 0 0 0 6 6l2-2m-2-10 2-2a4 4 0 0 1 6 6l-2 2"/></svg>',
      expand: '<svg viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>'
    };
    const brand = '<a class="brand" href="#"><img src="assets/logo.png" alt="Zlata wedding fashion"></a>';
    const header = (active = '') => `<header class="header">${brand}<nav class="nav">${['Wedding dresses','Collections','Evening dresses','Accessories','About','Contact'].map(label => `<a href="#" class="${active === label ? 'active' : ''}">${label}</a>`).join('')}</nav><div class="utilities"><button class="icon-button" aria-label="Search">${icons.search}</button><button class="icon-button" aria-label="Saved dresses">${icons.heart}</button><a class="language" href="#">English ${icons.down}</a></div></header>`;
    const footer = () => `<footer class="footer"><span>ZLATA WEDDING FASHION</span><div class="footer-links"><a href="#">Collections</a><a href="#">Size guide</a><a href="#">Contact</a><a href="#">Instagram ${icons.diagonal.replace('<svg ', '<svg style="width:10px;height:10px" ')}</a></div><span>&copy; 2026 Zlata</span></footer><div class="concept-note">Visual redesign concept &middot; Sample copy and proposed features &middot; Existing Zlata photography</div>`;
    const breadcrumb = (items) => `<div class="breadcrumb">${items.map((item, index) => `${index ? icons.chevron : ''}<span>${item}</span>`).join('')}</div>`;
    const dresses = [
      { name: 'Elayza', image: 'elayza.jpg', collection: 'Shine collection' },
      { name: 'Firuze', image: 'firuze.jpg', collection: 'Shine collection' },
      { name: 'Josephine', image: 'josephine.jpg', collection: 'Shine collection' },
      { name: 'Spenser', image: 'spenser.jpg', collection: 'Shine collection' },
      { name: 'Allure', image: 'allure.jpg', collection: 'Wedding dresses 2021' },
      { name: 'Bridget', image: 'bridget.jpg', collection: 'Wedding dresses 2021' }
    ];
    const card = dress => `<article class="card"><div class="card-photo"><img src="assets/${dress.image}" alt="${dress.name} wedding dress"><button class="save" aria-label="Save ${dress.name}">${icons.heart}</button></div><div class="card-info"><h3>${dress.name}</h3><span>Price on request</span></div><p class="collection">${dress.collection}</p></article>`;
    const sizes = () => `<div class="sizes">${[42,44,46,48].map(size => `<button class="size ${size === 44 ? 'selected' : ''}">${size}</button>`).join('')}</div>`;
    const colors = () => `<div class="color-options"><div class="option"><span class="swatch ivory chosen"></span>Ivory</div><div class="option"><span class="swatch cappuccino"></span>Cappuccino</div></div>`;
    const home = () => `
      <div class="announcement">A DRESS TO REMEMBER. A MOMENT THAT'S YOURS.</div>
      ${header()}
      <section class="hero"><div class="hero-copy"><div class="eyebrow">THE ZLATA COLLECTIONS</div><h1>For a moment.<br>For a <em>lifetime.</em></h1><p>Find the dress that feels like you. Discover wedding dresses, eveningwear and the finishing touches.</p><a class="btn dark" href="#">Explore wedding dresses ${icons.arrow}</a><a class="text-link" href="#">Discover our collections ${icons.diagonal}</a></div><div class="hero-photo"><img src="assets/shine-hero.jpg" alt="Two models wearing Zlata Shine wedding dresses"><div class="collection-tag"><div class="eyebrow">IN THE SPOTLIGHT</div><h3>Shine</h3><a href="#">Explore the collection ${icons.diagonal}</a></div></div></section>
      <nav class="category-strip"><a href="#">Wedding dresses ${icons.arrow}</a><a href="#">Evening dresses ${icons.arrow}</a><a href="#">Accessories ${icons.arrow}</a></nav>
      <section class="featured"><div class="section-title"><div><div class="eyebrow">CURATED FOR YOU</div><h2>Find your forever dress</h2></div><a class="text-link" href="#">Explore all wedding dresses ${icons.arrow}</a></div><div class="cards four">${dresses.slice(0,4).map(card).join('')}</div></section>
      ${footer()}`;
    const catalog = () => `
      ${header('Wedding dresses')}${breadcrumb(['Home','Wedding dresses'])}
      <section class="catalog-intro"><div class="eyebrow">THE BRIDAL EDIT</div><h1>Wedding dresses</h1><p>Explore the collections. Find the one that feels like you.</p></section>
      <section class="catalog"><aside class="filters"><div class="filter-heading"><span>Filter your edit</span><a href="#">Clear all</a></div><div class="filter-section"><h3>Collection ${icons.minus}</h3>${['All collections','Shine','Queen','Love is...','Wedding dresses 2021'].map((item,index)=>`<div class="option"><span class="checkbox ${index === 0 ? 'checked' : ''}">${index === 0 ? icons.check : ''}</span>${item}</div>`).join('')}</div><div class="filter-section"><h3>Size ${icons.minus}</h3>${sizes()}</div><div class="filter-section"><h3>Color ${icons.minus}</h3><div class="option"><span class="swatch ivory"></span>Ivory</div><div class="option"><span class="swatch cappuccino"></span>Cappuccino</div></div><div class="help-card"><h3>A little guidance?</h3><p>Have a question about a dress?<br>We'd love to hear from you.</p><a href="#">Contact Zlata ${icons.arrow}</a></div></aside><div><div class="catalog-toolbar"><span class="count">6 selected styles</span><div class="toolbar-right"><div class="toolbar-search">${icons.search}Search by dress name</div><a class="sort" href="#">Sort: Featured ${icons.down}</a></div></div><div class="cards three">${dresses.map(card).join('')}</div></div></section>
      ${footer()}`;
    const product = () => `
      ${header('Wedding dresses')}${breadcrumb(['Home','Wedding dresses','Wedding dresses 2021','Arina'])}
      <section class="product"><div class="product-gallery"><div class="product-main"><img src="assets/arina-angle.jpg" alt="Full-length view of the Arina wedding dress"><button class="zoom" aria-label="Expand gallery">${icons.expand}</button></div><div class="thumbnails">${['arina-angle.jpg','arina.jpg','arina-detail.jpg'].map((image,index)=>`<div class="thumb ${index === 0 ? 'selected' : ''}"><img src="assets/${image}" alt="Arina photo ${index + 1}"></div>`).join('')}<div class="gallery-hint">${icons.expand}Explore the gallery</div></div></div><div class="product-info"><div class="eyebrow">ZLATA BRIDAL</div><h1>Arina</h1><div class="product-price">Price on request</div><p class="product-description">An elegant silhouette with intricate lace detailing.<br>Explore the gallery and enquire about available options.</p><div class="field-label">Color</div>${colors()}<div class="field-label">Size <a href="#">Size guide</a></div>${sizes()}<div class="size-hint">Select a size to include in your enquiry.</div><a class="btn dark enquire" href="#">Enquire about this dress ${icons.arrow}</a><div class="secondary-actions"><a href="#">${icons.heart}Save this dress</a><a href="#">${icons.link}Copy link</a></div>${['Details & finishing','Sizing & fit','Ordering & availability'].map(label=>`<div class="accordion">${label}${icons.plus}</div>`).join('')}<p class="question">Something you'd like to know?<br><a href="#">Contact us about Arina.</a></p></div></section>
      ${footer()}`;
    const mobile = () => `
      <div class="mobile-page"><header class="mobile-header"><button class="icon-button" aria-label="Menu">${icons.menu}</button>${brand}<button class="icon-button" aria-label="Search">${icons.search}</button></header><div class="mobile-breadcrumb">Wedding dresses ${icons.chevron} Arina</div><div class="mobile-image"><img src="assets/arina-angle.jpg" alt="Full-length view of the Arina wedding dress"><div class="photo-count">${icons.expand}1 / 3</div></div><div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div><section class="mobile-info"><div class="eyebrow">ZLATA BRIDAL</div><div class="mobile-title"><h1>Arina</h1><span>Price on request</span></div><p>An elegant silhouette with intricate lace detailing.<br>Find the details. Make it yours.</p><div class="field-label">Color</div>${colors()}<div class="field-label">Size <a href="#">Size guide</a></div>${sizes()}<p class="question">Your selected size will be included in the enquiry.</p></section><div class="mobile-action"><a class="btn dark" href="#">Enquire about this dress ${icons.arrow}</a><button class="icon-button" aria-label="Save dress">${icons.heart}</button></div></div>`;
    const view = new URLSearchParams(location.search).get('view') || 'home';
    const views = { home, catalog, product, mobile };
    if (!views[view]) throw new Error(`Unknown concept: ${view}`);
    document.body.classList.toggle('mobile', view === 'mobile');
    document.getElementById('concept').innerHTML = views[view]();
  </script>
</body>
</html>
